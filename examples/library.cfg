#= Правила выдачи для разных групп читателей. =#
var standard_period := 14.;
var reminder_offset := 3.;
var student_limit := |+ 2 3|;
var catalog_name := q(Архив & библиотека);

([
    catalog : |print catalog_name|,
    loans : ([
        standard : ([
            period_days : |+ standard_period 0|,
            reminder_day : |- standard_period reminder_offset|,
        ]),
        student : ([
            period_days : |+ standard_period 7|,
            max_books : |+ student_limit 0|,
        ]),
    ]),
])
