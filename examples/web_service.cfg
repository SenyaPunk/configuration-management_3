#=
Параметры веб-сервиса.
Тайм-ауты заданы в секундах.
=#
var base_timeout := 2.5;
var retry_limit := |pow 2 2|;

([
    service : q(Справочный портал),
    network : ([
        host : q(localhost),
        port : 8080.,
        read_timeout : |+ base_timeout 1|,
    ]),
    retries : ([
        attempts : |+ retry_limit 1|,
        initial_delay : 0.5,
    ]),
])
