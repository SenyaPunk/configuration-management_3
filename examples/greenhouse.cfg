#= Пороги измерений и параметры опроса датчиков. =#
var desired_temperature := 24.5;
var tolerance := 2.;

([
    greenhouse : q(Оранжерея),
    temperature : ([
        minimum : |- desired_temperature tolerance|,
        maximum : |+ desired_temperature tolerance|,
    ]),
    sensors : ([
        humidity : ([
            minimum : 55.,
            unit : q(%),
        ]),
        poll_interval : |pow 2 3|,
    ]),
])
